<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Roundabout</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-slideshow" aria-hidden="true">
        <div class="bg-layer" id="bg-layer-0"></div>
        <div class="bg-layer" id="bg-layer-1"></div>
    </div>

    <div class="container">
        <div class="title_container">
            <h1>Blueprint Roundabout</h1>
            <p>an oblique strategy for everyday</p>
        </div>

        <div id="phrase-container">
            <p id="phrase"></p>
        </div>

        <button id="browse-btn" type="button">Browse all phrases</button>
    </div>

    <div id="phrase-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>All phrases</h2>
                <button id="close-modal" type="button" aria-label="Close">&times;</button>
            </div>
            <ul id="phrase-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
